name: Audit Gate 9E3 prerequisites

on:
  pull_request:

permissions:
  contents: read

jobs:
  protected-source:
    if: github.head_ref == 'agent/gate9e3-cloud-rollout'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          ref: f2f88cd39c102dcdf46916dfc782a91f503beaaa
      - name: Verify protected source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "f2f88cd39c102dcdf46916dfc782a91f503beaaa"
          grep -A2 '^\[functions.command-gateway\]' supabase/config.toml | grep -q 'verify_jwt = true'
          grep -q 'release_key: "day1_pilot_v1"' supabase/functions/_shared/command-gateway/runtime-registry.ts
          grep -q 'git_commit_sha: "969d4956a9247aa5f28ba18cc6fe587bd38c20f4"' supabase/functions/_shared/command-gateway/runtime-registry.ts

  supabase-access-token:
    if: github.head_ref == 'agent/gate9e3-cloud-rollout'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    steps:
      - name: Verify SUPABASE_ACCESS_TOKEN
        shell: bash
        env:
          VALUE: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: test -n "$VALUE"

  system-clock-secret:
    if: github.head_ref == 'agent/gate9e3-cloud-rollout'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    steps:
      - name: Verify ILKA_SYSTEM_CLOCK_HMAC_SECRET
        shell: bash
        env:
          VALUE: ${{ secrets.ILKA_SYSTEM_CLOCK_HMAC_SECRET }}
        run: test -n "$VALUE"

  allowed-origins:
    if: github.head_ref == 'agent/gate9e3-cloud-rollout'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    steps:
      - name: Verify ILKA_ALLOWED_ORIGINS
        shell: bash
        env:
          VALUE: ${{ secrets.ILKA_ALLOWED_ORIGINS }}
        run: test -n "$VALUE"
