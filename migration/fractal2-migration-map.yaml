version: 0.1.0
source_repository: SLADZARI/ILKA-EXPEDITION-OS-CI
source_commit: f508121bf06f47f703e6ccc7c93da944b98608db
purpose: >-
  Migration manifest for building Fractal 2 / project collaboration MVP on top of ILKA Expedition OS
  while preserving the current day-based role-play runtime, Supabase architecture, event sourcing,
  task lifecycle, voting, invitations, offline sync, and daily role rotation.

principles:
  - keep_day_runtime: true
  - keep_daily_role_rotation: true
  - keep_existing_supabase_architecture_for_first_migration: true
  - keep_event_sourcing_and_command_gateway: true
  - keep_tasks_stages_votes_outputs: true
  - do_not_mass_rename_backend_in_first_pass: true
  - add_session_layer_inside_day: true
  - one_day_one_primary_session_for_mvp: true
  - allow_multiple_sessions_later: true
  - roles_define_responsibility_not_contribution: true
  - spores_measure_contribution_not_ownership: true
  - first_session_generates_project_spores: true
  - next_session_can_confirm_previous_attribution_and_generate_new_spores: true

status_values: [KEEP, ADAPT, REPLACE_CONTENT, ADD, DEFER]

terminology:
  expedition:
    ui_name: project
    backend_action: KEEP
    note: Preserve expedition_id internally in first pass; expose Project in UI copy and adapters.
  captain:
    ui_name: project_owner
    backend_action: ADAPT
    note: Preserve captain permissions initially; remove vessel/safety semantics from UI/content.
  participant:
    ui_name: contributor
    backend_action: KEEP
  product_captain:
    ui_name: product_lead
    backend_action: ADAPT
  day:
    ui_name: day
    backend_action: KEEP
    note: Day remains the game cycle and role-rotation boundary.
  calendar_day:
    ui_name: day
    backend_action: KEEP
  product_stage:
    ui_name: project_stage
    backend_action: ADAPT
  card_bundle:
    ui_name: day_brief
    backend_action: ADAPT
  role_assignment:
    ui_name: daily_role_assignment
    backend_action: KEEP
  role_xp:
    ui_name: spores_provisional_adapter
    backend_action: ADAPT
    note: Do not equate permanently. Reuse UI/infrastructure initially; introduce contribution ledger as source of truth.
  expedition_rating:
    ui_name: contribution_rating
    backend_action: ADAPT
  onboard_role:
    ui_name: team_social_role
    backend_action: REPLACE_CONTENT
  product_role:
    ui_name: project_role
    backend_action: REPLACE_CONTENT
  shore_operator:
    ui_name: system_operator
    backend_action: ADAPT
  recovery_day:
    ui_name: recovery_day
    backend_action: KEEP

new_domain_entities:
  session:
    status: ADD
    scope: day
    fields:
      - session_id
      - expedition_id
      - day_number
      - started_at
      - ended_at
      - source_type
      - source_ref
      - expected_participant_ids
      - expected_role_assignments
      - status
      - processing_version
  session_analysis:
    status: ADD
    fields:
      - session_id
      - detected_speakers
      - speaker_mapping
      - summary
      - ideas
      - hypotheses
      - decisions
      - disagreements
      - evidence
      - tasks
      - project_changes
      - generated_spores
      - model_metadata
  contribution:
    status: ADD
    fields:
      - contribution_id
      - session_id
      - participant_id
      - contribution_type
      - claim
      - evidence_refs
      - affected_object_type
      - affected_object_id
      - impact
      - confidence
      - proposed_spores
      - settled_spores
      - status
  spore_allocation:
    status: ADD
    fields:
      - allocation_id
      - session_id
      - participant_id
      - generated_amount
      - settled_amount
      - status
      - evidence_refs
      - confirmed_by
      - confirmed_at
  speaker_identity_mapping:
    status: ADD
    fields:
      - session_id
      - speaker_label
      - participant_id
      - confidence
      - source
      - status

new_commands:
  - command_type: create_session
    status: ADD
    allowed_actors: [captain, product_captain]
  - command_type: attach_session_source
    status: ADD
    allowed_actors: [captain, product_captain, participant]
  - command_type: process_session
    status: ADD
    allowed_actors: [system, shore_operator]
  - command_type: confirm_speaker_mapping
    status: ADD
    allowed_actors: [captain, product_captain]
  - command_type: confirm_contribution_attribution
    status: ADD
    allowed_actors: [captain, product_captain]
  - command_type: settle_session
    status: ADD
    allowed_actors: [captain, product_captain, system]

existing_commands:
  create_expedition: {status: ADAPT, ui_name: create_project}
  invite_participant: {status: KEEP, ui_name: invite_contributor}
  accept_invitation: {status: KEEP, ui_name: join_project}
  revoke_invitation: {status: KEEP}
  ban_participant: {status: KEEP}
  unban_participant: {status: KEEP}
  generate_rotation: {status: ADAPT, note: keep daily rotation engine; replace maritime role policy/content}
  start_expedition: {status: ADAPT, ui_name: start_project}
  request_stage_advance: {status: KEEP}
  advance_stage: {status: KEEP}
  override_stage_advance: {status: KEEP}
  process_day_boundary: {status: KEEP, note: preserve current timing and processing window}
  recover_day_transition: {status: KEEP}
  force_day_transition: {status: KEEP}
  rewind_day: {status: KEEP}
  start_evening_session: {status: ADAPT, note: repurpose around daily project call/session semantics}
  acknowledge_card: {status: KEEP}
  start_task: {status: KEEP}
  block_task: {status: KEEP}
  complete_task: {status: KEEP}
  waive_task: {status: KEEP}
  confirm_output: {status: KEEP, note: evidence_refs can support contribution provenance}
  create_decision_draft: {status: KEEP}
  create_vote: {status: KEEP}
  vote: {status: KEEP}
  finalize_product_decision: {status: KEEP}
  override_product_decision: {status: KEEP}
  request_day_close: {status: KEEP}
  close_day: {status: KEEP}
  close_expedition: {status: ADAPT, ui_name: close_project}
  override_day_close: {status: KEEP}
  override_role_assignment: {status: KEEP}
  activate_recovery_day: {status: KEEP}
  suspend_program: {status: KEEP}
  resume_program: {status: KEEP}
  verify_role_assignment: {status: ADAPT, note: role performance remains separate from contribution attribution}
  adjust_role_xp: {status: ADAPT, note: temporary bridge only; do not make XP the contribution source of truth}
  publish_rating_snapshot: {status: ADAPT}

