    status: ADD
    variants: [upcoming, in_progress, processing, processed, review_required]
  session_source_uploader:
    status: ADD
    variants: [transcript, audio, link, manual]
  speaker_mapping_card:
    status: ADD
    variants: [review, confirmed]
  speaker_mapping_row:
    status: ADD
    states: [suggested, confirmed, corrected, uncertain]
  session_summary_card:
    status: ADD
  project_delta_card:
    status: ADD
    variants: [idea, hypothesis, decision, evidence, task, risk]
  contribution_card:
    status: ADD
    states: [proposed, confirmed, corrected]
  spore_allocation_card:
    status: ADD
    states: [generated, pending_attribution, settled]
  session_review_panel:
    status: ADD
  previous_day_settlement_card:
    status: ADD

screens:
  participant_today:
    status: ADAPT
    existing_file: frontend/src/screens/participant/TodayScreen.tsx
    add_sections:
      - current_day_role_brief
      - today_session_brief
      - previous_day_session_result
      - pending_spore_settlement
  product_role_detail:
    status: ADAPT
    existing_file: frontend/src/screens/participant/ProductRoleDetailScreen.tsx
    changes:
      - rename_product_role_copy_to_project_role
      - include_call_responsibility
      - include_speaking_order_or_facilitation_script_when_role_requires_it
  gamification:
    status: ADAPT
    existing_file: frontend/src/screens/participant/GamificationScreen.tsx
    changes:
      - display_spores
      - display_contribution_ledger
      - keep_role_mastery
  vote:
    status: KEEP
    existing_file: frontend/src/screens/participant/ProductDecisionVoteScreen.tsx
  session_review:
    status: ADD
    proposed_file: frontend/src/screens/participant/SessionReviewScreen.tsx
  session_upload:
    status: ADD
    proposed_file: frontend/src/screens/participant/SessionUploadScreen.tsx

frontend_core:
  frontend/src/app/App.tsx:
    status: ADAPT
    changes:
      - add_session_review_route
      - add_session_upload_route
      - preserve_participant_and_captain_composition_for_first_pass
  frontend/src/application/projections/bootstrap.ts:
    status: ADAPT
    changes:
      - add_session_projection
      - add_pending_settlement_projection
  frontend/src/application/offline/:
    status: KEEP
  frontend/src/application/sync/:
    status: KEEP
  frontend/src/application/commands/CommandDispatcher.ts:
    status: KEEP
  frontend/src/pwa/:
    status: KEEP

methodology:
  maritime_roles:
    status: REPLACE_CONTENT
    replacement_groups:
      project_roles:
        - host_facilitator
        - analyst
        - product_lead
        - researcher
        - critic_challenger
        - designer
        - developer
        - qa_tester
        - marketer
        - synthesizer
      team_social_roles:
        - connector
        - observer
        - moderator
        - storyteller
        - scout
    note: Final role list must be validated against existing role schemas and rotation compatibility constraints before code changes.
  daily_role_cards:
    status: REPLACE_CONTENT
    principles:
      - every role has a clear responsibility for the day
      - host role includes call organization and speaking-order guidance
      - role card describes required outputs
      - participant may contribute outside assigned role
      - contribution attribution never relies solely on assigned role

speaker_attribution:
  strategy:
    - diarize source into speaker labels
    - use known roster and daily roles as context hints only
    - map speaker labels to participant identities
    - show confidence
    - require human confirmation when uncertain
    - contributions always attach to confirmed participant identity, not inferred role
  non_goals_for_mvp:
    - persistent voice biometrics
    - automatic identity recognition across all future calls
    - embedded call recorder

spores:
  source_of_truth: contribution_ledger
  states:
    generated:
      meaning: session created estimated project value not yet finally attributed
    proposed:
      meaning: AI proposes participant allocations
    settled:
      meaning: allocation confirmed by team/authorized reviewer
  rules:
    - first processed session may generate spores without final participant distribution
    - next day can confirm previous allocation
    - current day can simultaneously settle previous spores and generate new spores
    - correction changes attribution, not historical source material
    - spores do not imply equity, IP ownership, compensation, revenue share, or token rights

supabase:
  first_pass:
    status: KEEP
    strategy: reuse current project and connection; do not restructure existing tables until application migration is proven
  new_tables_or_documents:
    - sessions
    - session_sources
    - session_analyses
    - contributions
    - spore_allocations
    - speaker_identity_mappings
  new_events:
    - session.created
    - session.source_attached
    - session.processing_started
    - session.processed
    - speaker_mapping.proposed
    - speaker_mapping.confirmed
    - contribution.proposed
    - contribution.confirmed
    - spores.generated
    - spores.settled
  preserve:
    - event_log
    - command_receipts
    - projection_heads
    - projection_documents
    - command_gateway
    - immutable_history
    - RLS_and_actor_resolution

explicitly_deferred:
  - game_fractal_1_rebuild
  - public_social_network
  - expert_marketplace
  - prompt_marketplace
  - embedded_audio_recording
  - realtime_meeting_bot
  - voice_biometric_identity
  - spores_to_money_conversion
  - equity_distribution
  - IP_ownership_enforcement
  - new_supabase_project
  - mass_backend_renaming

migration_order:
  - inventory_and_freeze_source
  - create_separate_target_repository
  - copy_repository_at_source_commit
  - connect_existing_supabase_without_schema_rename
  - replace_brand_and_ui_vocabulary
  - replace_maritime_role_content
  - add_session_schemas_and_events
  - add_session_ingestion
  - add_ai_session_analysis
  - add_speaker_mapping_review
  - add_contribution_ledger
  - add_spore_settlement
  - adapt_today_and_gamification_screens
  - run_3_to_5_day_pilot_with_3_to_5_people

mvp_acceptance:
  - project can be created and participants invited
  - daily role rotation works unchanged
  - each participant sees today's role and call responsibility
  - one primary session can be attached to a day
  - transcript can be processed
  - speakers can be mapped and corrected
  - AI produces session summary and project delta
  - AI proposes contributions and generated spores
  - next day can settle prior attribution
  - tasks and decisions continue to use existing ILKA engine
  - all settled contributions have evidence/provenance
